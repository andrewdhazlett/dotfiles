modelRoles:
  default: anthropic/claude-opus-5-5:high
  plan: anthropic/claude-opus-5-5:max
  slow: openai-codex/gpt-6-astra:max
  task: openai-codex/gpt-6-astra:xhigh
  smol: openai-codex/gpt-6-astra:low
  vision: anthropic/claude-opus-5-5:high
  commit: anthropic/claude-sonnet-5-5:medium
  advisor: openai-codex/gpt-6-astra:high
  tiny: "@smol"
  memory: "@smol"
  widget: "@smol"
  judge: anthropic/claude-sonnet-5-5
task:
  agentModelOverrides:
    scout: anthropic/claude-sonnet-5-5:low
    reviewer: "@advisor"
    security-reviewer: "@slow"
    task: "@task"
    sonic: "@smol"
  agentServiceTierOverrides:
    sonic: priority
compaction:
  thresholdTokens: 280000
memory:
  backend: hindsight
hindsight:
  apiUrl: http://localhost:8888
  # Personal bank only; the work profile's bank keeps work specifics.
  retainMission: >-
    Personal memory bank for one user's personal projects and agent tooling.
    Keep durable lessons, decisions, procedures, and preferences, but strip
    anything identifying the user's employer: no employer, organisation,
    product, customer, or internal repository, service, or host names; no
    ticket, PR, issue, or workspace IDs; no internal URLs; no colleague names
    or handles; no filesystem paths inside work directories. Never store
    secrets (API keys, tokens, passwords, auth codes). Generalise instead
    ("a work repo", "the work tracker", "a colleague"). If a fact is only
    meaningful with those identifiers, do not store it.
features:
  unexpectedStopDetection: smart
setupVersion: 2
theme:
  dark: dark-nord
symbolPreset: nerd
composer:
  shape: band